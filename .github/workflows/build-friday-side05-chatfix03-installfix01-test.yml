name: Build FRIDAY Side05 InstallFix Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract InstallFix source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'FRIDAY_NEXUS_v10.11.2_STABLE_SIDE05_CHATFIX03_INSTALLFIX01_SOURCE*.zip' | sort | head -n 1)"
          if [[ -z "$ZIP" ]]; then
            echo 'ERROR: InstallFix source ZIP was not found in repository root.'
            find . -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi
          rm -rf extracted source
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          if [[ -f extracted/settings.gradle.kts ]]; then
            mv extracted source
          else
            ROOT_DIR="$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$ROOT_DIR"
            mv "$ROOT_DIR" source
          fi
          test -f source/settings.gradle.kts
          test -f source/gradlew
          test -s source/gradle/wrapper/gradle-wrapper.jar
          test -s source/test-signing/friday-test-debug.jks
          chmod +x source/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate InstallFix source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_kotlin_illegal_escapes.py
          bash tools/run_side05_compilefix_tests.sh
          python3 tools/run_side05_installfix_tests.py
          python3 tools/validate_project.py
          python3 tools/validate_secure_online_brain.py
          python3 tools/kotlin_syntax_sanity.py
          python3 tools/verify_build_order.py
          python3 tools/run_side04_fix_tests.py
          bash tools/run_v1011_stability_tests.sh
          bash tools/run_v1011_regression_tests.sh
          bash tools/run_v1011_side05_chatfix_tests.sh
          bash tools/run_side05_chatfix_simulation.sh
          bash tools/compile_local_model_runtime_with_stubs.sh

      - name: Build fixed-signer test APK
        id: assemble
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee assembleDebug.log

      - name: Run debug unit tests
        if: steps.assemble.outcome == 'success'
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee testDebugUnitTest.log

      - name: Run Android lint
        if: steps.assemble.outcome == 'success'
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --no-daemon --stacktrace 2>&1 | tee lintDebug.log

      - name: Verify APK identity and signer
        if: steps.assemble.outcome == 'success'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee "$APK.sha256"

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$APK.signature.txt"
          "$AAPT" dump badging "$APK" | tee "$APK.badging.txt"

          grep -F "package: name='com.friday.stable.test'" "$APK.badging.txt"
          grep -F "versionCode='1115'" "$APK.badging.txt"
          grep -F "FRIDAY Test Debug" "$APK.signature.txt"
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" "$APK.signature.txt"

          printf '%s\n' \
            'Package: com.friday.stable.test' \
            'Label: FRIDAY TEST' \
            'Signer: fixed public test-only key' \
            'This APK can update future FRIDAY TEST builds from any GitHub runner.' \
            'It can never update com.friday.stable.' \
            > app/build/outputs/apk/debug/INSTALL-NOTES.txt

      - name: Upload InstallFix test APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-SIDE05-CHATFIX03-INSTALLFIX01-TEST-APK
          if-no-files-found: error
          retention-days: 14
          path: |
            source/app/build/outputs/apk/debug/app-debug.apk
            source/app/build/outputs/apk/debug/app-debug.apk.sha256
            source/app/build/outputs/apk/debug/app-debug.apk.signature.txt
            source/app/build/outputs/apk/debug/app-debug.apk.badging.txt
            source/app/build/outputs/apk/debug/INSTALL-NOTES.txt
            source/app/build/reports/lint-results-debug.html
            source/app/build/reports/tests/testDebugUnitTest/

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-SIDE05-CHATFIX03-INSTALLFIX01-DIAGNOSTICS
          if-no-files-found: warn
          retention-days: 14
          path: |
            source/assembleDebug.log
            source/testDebugUnitTest.log
            source/lintDebug.log
            source/app/build/reports/problems/
            source/app/build/reports/tests/
            source/app/build/reports/lint-results-debug.html
